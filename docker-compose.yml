version: '3.8'

services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cicd_network
    restart: unless-stopped

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/mini-cicd
      - REDIS_URL=redis://redis:6379
      - API_AUTH_TOKEN=${API_AUTH_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - GITHUB_SECRET=${GITHUB_SECRET}
      - ALLOWED_REPOS=${ALLOWED_REPOS}
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cicd_network
    restart: unless-stopped

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile.worker
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/mini-cicd
      - REDIS_URL=redis://redis:6379
      - API_AUTH_TOKEN=${API_AUTH_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - GITHUB_SECRET=${GITHUB_SECRET}
      - ALLOWED_REPOS=${ALLOWED_REPOS}
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cicd_network
    restart: unless-stopped

  mongodb:
    image: mongo:6
    volumes:
      - mongodb_data:/data/db
    networks:
      - cicd_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - cicd_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  cicd_network:

volumes:
  mongodb_data:
  redis_data:
